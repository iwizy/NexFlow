name: Extension Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/extension-compatibility.yml'
      - 'docs/0.7/extension-compatibility.md'
      - 'extensions/registry-policy.mjs'
      - 'extensions/registry.schema.json'
      - 'extensions/registry.example.yaml'
      - 'fixtures/extension-registry/**'
      - 'package-lock.json'
      - 'schemas/common.schema.json'
      - 'schemas/extensions.schema.json'
      - 'scripts/extension-compatibility-smoke.mjs'
      - 'scripts/test/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/extension-compatibility.yml'
      - 'docs/0.7/extension-compatibility.md'
      - 'extensions/registry-policy.mjs'
      - 'extensions/registry.schema.json'
      - 'extensions/registry.example.yaml'
      - 'fixtures/extension-registry/**'
      - 'package-lock.json'
      - 'schemas/common.schema.json'
      - 'schemas/extensions.schema.json'
      - 'scripts/extension-compatibility-smoke.mjs'
      - 'scripts/test/**'

permissions:
  contents: read

jobs:
  extension-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the published reference archives
        run: |
          release=https://github.com/iwizy/NexFlow/releases/download/v0.5.0-alpha.1
          for package in cli validation; do
            archive="nexflow-$package-0.5.0-alpha.1.tgz"
            curl --fail --silent --show-error --location --retry 3 --max-time 90 \
              "$release/$archive" --output "$RUNNER_TEMP/$archive"
          done
      - name: Verify archive hashes and run the offline fixtures
        run: |
          node scripts/extension-compatibility-smoke.mjs \
            "$RUNNER_TEMP/nexflow-cli-0.5.0-alpha.1.tgz" \
            "$RUNNER_TEMP/nexflow-validation-0.5.0-alpha.1.tgz" \
            > "$RUNNER_TEMP/nf-117-extension-compatibility.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nf-117-extension-compatibility
          path: ${{ runner.temp }}/nf-117-extension-compatibility.json
          if-no-files-found: error
