name: Integration Metadata Boundaries

on:
  pull_request:
    paths:
      - '.github/workflows/integration-metadata.yml'
      - 'extensions/**/profile.yaml'
      - 'fixtures/integrations/**'
      - 'scripts/integration-metadata-smoke.mjs'
      - 'package-lock.json'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/integration-metadata.yml'
      - 'extensions/**/profile.yaml'
      - 'fixtures/integrations/**'
      - 'scripts/integration-metadata-smoke.mjs'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  integration-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/integration-metadata-smoke.mjs
