name: Python Candidate
on:
  pull_request:
    paths:
      - 'evaluation/**'
      - 'scripts/runtime-python*'
      - 'scripts/runtime-evaluation*'
      - '.github/workflows/python-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initial-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Provision hash-locked environment and separate wheelhouse
        run: |
          python -I -m venv .venv
          .venv/bin/python -I -m pip --isolated download --require-hashes --only-binary=:all: -r evaluation/prototypes/python/requirements.lock --dest wheelhouse
          .venv/bin/python -I -m pip --isolated install --no-index --find-links wheelhouse --require-hashes --only-binary=:all: -r evaluation/prototypes/python/requirements.lock
          .venv/bin/python -I -m pip check
          npm ci --ignore-scripts
      - name: Compile independent source and test boundaries
        run: |
          .venv/bin/python -I -m compileall -q evaluation/prototypes/python
          .venv/bin/python -I -B evaluation/prototypes/python/self_test.py
      - name: Verify frozen corpus and shared cases twice
        run: |
          npm run runtime-evaluation-smoke
          npm run runtime-python-prototype-smoke
          node scripts/runtime-evaluation-run.mjs --command '[".venv/bin/python","-I","-B","evaluation/prototypes/python/cli.py"]'
          node scripts/runtime-python-library-run.mjs .venv/bin/python
