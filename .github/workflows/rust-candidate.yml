name: Rust Candidate
on:
  pull_request:
    paths:
      - 'evaluation/**'
      - 'scripts/runtime-rust*'
      - 'scripts/runtime-evaluation*'
      - '.github/workflows/rust-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initial-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Provision exact compiler and locked dependency graph
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          cargo +1.99.0 fetch --locked --manifest-path evaluation/prototypes/rust/Cargo.toml
          npm ci --ignore-scripts
      - name: Build independent native source and test boundaries
        run: |
          cargo +1.99.0 build --frozen --manifest-path evaluation/prototypes/rust/Cargo.toml
          cargo +1.99.0 test --frozen --manifest-path evaluation/prototypes/rust/Cargo.toml
      - name: Verify frozen corpus and shared cases twice
        run: |
          npm run runtime-evaluation-smoke
          npm run runtime-rust-prototype-smoke
          node scripts/runtime-evaluation-run.mjs --command '["evaluation/prototypes/rust/target/debug/nexflow-rust-evaluation"]'
          node scripts/runtime-rust-library-run.mjs evaluation/prototypes/rust/target/debug/library-driver
          node scripts/runtime-evaluation-repair-run.mjs rust '["evaluation/prototypes/rust/target/debug/library-driver"]' --summary
