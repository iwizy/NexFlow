name: Schema Validation

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install validation tooling
        run: npm ci --ignore-scripts

      - name: Validate repository schemas and example manifests
        run: npm run validate

      - name: Verify negative schema fixtures
        run: npm run negative-schema-fixtures

      - name: Run typed reference primitive checks
        run: npm run typed-reference-schema-smoke

      - name: Run work reference namespace checks
        run: npm run work-reference-namespace-smoke

      - name: Run approval gate target schema checks
        run: npm run approval-gate-target-schema-smoke

      - name: Run ActorSet schema boundary checks
        run: npm run actor-schema-smoke

      - name: Run agent identity schema boundary checks
        run: npm run agent-identity-schema-smoke

      - name: Run agent definition authority checks
        run: npm run agent-definition-authority-smoke

      - name: Run Core Profile conformance checks
        run: npm run core-profile-smoke

      - name: Run manifest discovery and multi-workflow checks
        run: npm run manifest-discovery-smoke

      - name: Run repository CLI prototype checks
        run: npm run cli-prototype-smoke

      - name: Run CLI structural validation checks
        run: npm run cli-validation-smoke

      - name: Run CLI machine-readable diagnostic checks
        run: npm run cli-diagnostics-smoke

      - name: Run CLI declared inspection checks
        run: npm run cli-inspection-smoke

      - name: Run CLI static graph checks
        run: npm run cli-graph-smoke

      - name: Run CLI starter initialization checks
        run: npm run cli-init-smoke

      - name: Run credential handling schema boundary checks
        run: npm run credential-handling-schema-smoke

      - name: Run human override schema boundary checks
        run: npm run human-override-schema-smoke

      - name: Run MCP extension profile checks
        run: npm run mcp-extension-smoke

      - name: Run A2A extension profile checks
        run: npm run a2a-extension-smoke

      - name: Run provider feature schema checks
        run: npm run provider-feature-schema-smoke

      - name: Run provider constraint schema checks
        run: npm run provider-constraint-schema-smoke

      - name: Run conformance claim format checks
        run: npm run conformance-claim-smoke

      - name: Run candidate readiness record checks
        run: npm run candidate-readiness-smoke

      - name: Run semantic reference smoke checks
        run: npm run semantic-smoke
