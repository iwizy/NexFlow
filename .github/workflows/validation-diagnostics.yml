name: Validation Diagnostics Requalification
on:
  pull_request:
    paths:
      - 'evaluation/**'
      - 'schemas/**'
      - 'scripts/runtime-diagnostics*'
      - 'scripts/lib/diagnostic-requalification.mjs'
      - 'scripts/lib/evaluation-library.mjs'
      - 'scripts/lib/runtime-evaluation.mjs'
      - '.github/workflows/validation-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-observations:
    name: Native diagnostics / ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        candidate: [typescript, python, rust, go]
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: matrix.candidate == 'python'
        with:
          python-version: '3.12.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: matrix.candidate == 'go'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Provision reviewed locks separately from evaluation
        run: |
          test "$(npm --version)" = '10.9.8'
          npm ci --ignore-scripts
          case '${{ matrix.candidate }}' in
            typescript) npm --prefix evaluation/prototypes/typescript ci --ignore-scripts ;;
            python)
              python -I -m venv .venv
              .venv/bin/python -I -m pip --isolated download --require-hashes --only-binary=:all: -r evaluation/prototypes/python/requirements.lock --dest "$RUNNER_TEMP/wheelhouse"
              .venv/bin/python -I -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/wheelhouse" --require-hashes --only-binary=:all: -r evaluation/prototypes/python/requirements.lock
              .venv/bin/python -I -m pip check ;;
            rust)
              rustup toolchain install 1.99.0 --profile minimal --no-self-update
              cargo +1.99.0 fetch --locked --manifest-path evaluation/prototypes/rust/Cargo.toml ;;
            go) cd evaluation/prototypes/go && go mod download && go mod verify ;;
          esac
      - name: Build without fetching and collect complete native observations
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          case '${{ matrix.candidate }}' in
            typescript)
              npm --prefix evaluation/prototypes/typescript run build
              node scripts/runtime-diagnostics-requalify-run.mjs typescript '["node"]' '["node","evaluation/prototypes/typescript/dist/cli.js"]' "$RUNNER_TEMP/typescript-diagnostics.json" ;;
            python)
              node scripts/runtime-diagnostics-requalify-run.mjs python '[".venv/bin/python","-I","-B","evaluation/prototypes/python/library_driver.py"]' '[".venv/bin/python","-I","-B","evaluation/prototypes/python/cli.py"]' "$RUNNER_TEMP/python-diagnostics.json" ;;
            rust)
              cargo +1.99.0 build --frozen --manifest-path evaluation/prototypes/rust/Cargo.toml
              node scripts/runtime-diagnostics-requalify-run.mjs rust '["evaluation/prototypes/rust/target/debug/library-driver"]' '["evaluation/prototypes/rust/target/debug/nexflow-rust-evaluation"]' "$RUNNER_TEMP/rust-diagnostics.json" ;;
            go)
              (cd evaluation/prototypes/go && go build -mod=readonly -trimpath -buildvcs=false -o bin/nexflow-go-evaluation ./cmd/cli && go build -mod=readonly -trimpath -buildvcs=false -o bin/library-driver ./cmd/library-driver)
              node scripts/runtime-diagnostics-requalify-run.mjs go '["evaluation/prototypes/go/bin/library-driver"]' '["evaluation/prototypes/go/bin/nexflow-go-evaluation"]' "$RUNNER_TEMP/go-diagnostics.json" ;;
          esac
      - name: Verify retained failures and exact evidence bindings
        run: npm run runtime-diagnostics-requalification-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-diagnostics-${{ matrix.candidate }}
          path: ${{ runner.temp }}/${{ matrix.candidate }}-diagnostics.json
          if-no-files-found: error
