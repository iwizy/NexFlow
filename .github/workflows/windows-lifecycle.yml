name: Windows Evaluation Lifecycle
on:
  pull_request:
    paths:
      - 'evaluation/lifecycle/windows/**'
      - 'scripts/runtime-windows*'
      - 'scripts/lib/windows-lifecycle-evidence.mjs'
      - '.github/workflows/windows-lifecycle.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    name: Windows lifecycle (${{ matrix.candidate }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [typescript, python, rust, go]
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve exact repository bytes in this disposable runner
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Reuse immutable stored native evidence only when sources match
        id: plan
        shell: pwsh
        run: |
          $js = @'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const sha = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const file = 'evaluation/lifecycle/windows/${{ matrix.candidate }}.json';
          let collect = true;
          if (fs.existsSync(file)) {
            const r = JSON.parse(fs.readFileSync(file)), pins = JSON.parse(fs.readFileSync('evaluation/fidelity/source-pins.json'));
            collect = r.sourceRevision !== pins.candidates['${{ matrix.candidate }}'].sourceRevision
              || ![...r.collectorSources, ...r.sourceManifest].every(s => sha(s.path) === s.sha256);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'collect=' + collect + '\n');
          '@
          node -e $js
      - name: Provision pinned maintenance checks
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: matrix.candidate == 'python' && steps.plan.outputs.collect == 'true'
        continue-on-error: true
        with:
          python-version: '3.12.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: matrix.candidate == 'go' && steps.plan.outputs.collect == 'true'
        continue-on-error: true
        with:
          go-version: '1.27.1'
          cache: false
      - name: Provision reviewed compiler and dependency caches online
        if: steps.plan.outputs.collect == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check-Native { if ($LASTEXITCODE -ne 0) { throw 'Pinned provisioning command failed' } }
          switch ('${{ matrix.candidate }}') {
            'typescript' {
              npm --prefix evaluation/prototypes/typescript ci --ignore-scripts
              Check-Native
            }
            'python' {
              python -I -m venv .venv
              Check-Native
              .venv/Scripts/python -I -m pip --isolated download --require-hashes --only-binary=:all: -r evaluation/prototypes/python/requirements.lock --dest wheelhouse
              Check-Native
              .venv/Scripts/python -I -m pip --isolated install --no-index --find-links wheelhouse --require-hashes --only-binary=:all: -r evaluation/prototypes/python/requirements.lock
              Check-Native
              .venv/Scripts/python -I -m pip check
              Check-Native
            }
            'rust' {
              rustup toolchain install 1.99.0 --profile minimal --no-self-update
              Check-Native
              cargo +1.99.0 fetch --locked --manifest-path evaluation/prototypes/rust/Cargo.toml
              Check-Native
            }
            'go' {
              Push-Location evaluation/prototypes/go
              try { go mod download; Check-Native; go mod verify; Check-Native } finally { Pop-Location }
            }
          }
      - name: Capture native lifecycle or exact build blocker without promoting gates
        if: steps.plan.outputs.collect == 'true'
        shell: pwsh
        run: node scripts/runtime-windows-lifecycle.mjs '${{ matrix.candidate }}' "$env:RUNNER_TEMP/lifecycle.json" "$env:RUNNER_TEMP/evaluation-capsules"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.plan.outputs.collect == 'true'
        with:
          name: windows-evaluation-${{ matrix.candidate }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/lifecycle.json
            ${{ runner.temp }}/evaluation-capsules/*.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Check stored evidence without repeating confirmed native work
        if: steps.plan.outputs.collect != 'true'
        run: npm run runtime-windows-lifecycle-smoke
