specVersion: "0.1"
kind: ProviderSet
metadata:
  project: enterprise-team
providers:
  - id: enterprise_reasoning
    type: abstract
    description: Provider-neutral enterprise-approved reasoning class.
    features:
      - text_generation
      - code_reasoning
      - policy_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: organization_policy
      toolUse: declared_tools_only
      maxSensitivity: restricted
      costTier: high
      latencyClass: batch
      approvalRequired: true
      dataRetention:
        mode: organization_policy
    selection:
      strategy: governed_provider_policy
