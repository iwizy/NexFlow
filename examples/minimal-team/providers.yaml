specVersion: "0.1"
kind: ProviderSet
metadata:
  project: minimal-team
providers:
  - id: general_reasoning
    type: abstract
    description: Provider-neutral reasoning class.
    features:
      - text_generation
      - tool_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: internal
      costTier: low
      latencyClass: interactive
    selection:
      strategy: project_policy
      explainability:
        recordSelectionReason: true
        recordConstraintsApplied: true
