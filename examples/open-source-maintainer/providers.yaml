specVersion: "0.1"
kind: ProviderSet
metadata:
  project: open-source-maintainer
providers:
  - id: community_reasoning
    type: abstract
    description: Provider-neutral reasoning class for public issue triage, documentation, and release notes.
    features:
      - text_generation
      - policy_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: internal
      costTier: low
      latencyClass: interactive
    selection:
      strategy: project_policy
  - id: code_review_reasoning
    type: abstract
    description: Provider-neutral reasoning class for repository and pull request review evidence.
    features:
      - text_generation
      - code_reasoning
      - policy_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: internal
      costTier: medium
      latencyClass: interactive
    selection:
      strategy: project_policy
