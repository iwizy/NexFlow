specVersion: "0.1"
kind: ProviderSet
metadata:
  project: product-delivery-team
providers:
  - id: product_reasoning
    type: abstract
    description: Provider-neutral product and UX reasoning class.
    features:
      - text_generation
      - visual_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: confidential
      costTier: medium
      latencyClass: interactive
    selection:
      strategy: project_policy
  - id: coding_reasoning
    type: abstract
    description: Provider-neutral coding and testing reasoning class.
    features:
      - text_generation
      - code_reasoning
      - tool_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: confidential
      costTier: medium
      latencyClass: interactive
    selection:
      strategy: project_policy
