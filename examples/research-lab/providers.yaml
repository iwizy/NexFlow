specVersion: "0.1"
kind: ProviderSet
metadata:
  project: research-lab
providers:
  - id: research_reasoning
    type: abstract
    description: Provider-neutral reasoning class for literature review, citations, and research writing.
    features:
      - text_generation
      - policy_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: confidential
      costTier: high
      latencyClass: batch
    selection:
      strategy: project_policy
  - id: experiment_reasoning
    type: abstract
    description: Provider-neutral reasoning class for experiment planning, result recording, and reproducibility support.
    features:
      - text_generation
      - code_reasoning
      - tool_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: confidential
      costTier: high
      latencyClass: batch
    selection:
      strategy: project_policy
