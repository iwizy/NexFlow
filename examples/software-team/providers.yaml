specVersion: "0.1"
kind: ProviderSet
metadata:
  project: software-team
providers:
  - id: coding_reasoning
    type: abstract
    description: Provider-neutral coding and review model class.
    features:
      - text_generation
      - code_reasoning
      - tool_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: confidential
      costTier: medium
      latencyClass: interactive
    selection:
      strategy: project_policy
  - id: general_reasoning
    type: abstract
    description: Provider-neutral general reasoning model class.
    features:
      - text_generation
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: confidential
      costTier: medium
      latencyClass: interactive
    selection:
      strategy: project_policy
