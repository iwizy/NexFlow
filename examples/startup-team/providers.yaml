specVersion: "0.1"
kind: ProviderSet
metadata:
  project: startup-team
providers:
  - id: coding_reasoning
    type: abstract
    description: Provider-neutral coding model class.
    features:
      - code_reasoning
      - text_generation
      - tool_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: internal
      costTier: medium
      latencyClass: interactive
    selection:
      strategy: project_policy
  - id: general_reasoning
    type: abstract
    description: Provider-neutral product and design reasoning class.
    features:
      - text_generation
      - visual_reasoning
    constraints:
      trainingUse: prohibited
      dataResidency: project_policy
      toolUse: declared_tools_only
      maxSensitivity: internal
      costTier: medium
      latencyClass: interactive
    selection:
      strategy: project_policy
